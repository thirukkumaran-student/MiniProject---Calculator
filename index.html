<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniProject - Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id = 'calculator'>
        <div id = 'display'>
            <h2 id = 'digit-display'></h2>
        </div>
        <div id = 'buttons'>
            <div class = 'layer'>
            <button onclick = "appendToDisplay('1')" id = '1' class="button">1</button>
            <button onclick = "appendToDisplay('2')" id = '2' class="button">2</button>
            <button onclick = "appendToDisplay('3')" id = '3' class="button">3</button>
            <button onclick = "appendToDisplay('+')" id = 'add' class="button">+</button>
            <button onclick = "appendToDisplay('%')" id = 'percent' class="button">%</button>
            </div>
            <div class = 'layer'>
            <button onclick = "appendToDisplay('4')" id = '4' class="button">4</button>
            <button onclick = "appendToDisplay('5')" id = '5' class="button">5</button>
            <button onclick = "appendToDisplay('6')" id = '6' class="button">6</button>
            <button onclick = "appendToDisplay('-')" id = 'sub' class="button">-</button>
            <button onclick = "appendToDisplay('^')" id = 'power' class="button">^</button>
            </div><div class = 'layer'>
            <button onclick = "appendToDisplay('7')" id = '7' class="button">7</button>
            <button onclick = "appendToDisplay('8')" id = '8' class="button">8</button>
            <button onclick = "appendToDisplay('9')" id = '9' class="button">9</button>
            <button onclick = "appendToDisplay('X')" id = 'product' class="button">X</button>
            <button onclick = "deleteFromDisplay()" id = 'delete' class="button" style = "width: 65px">DEL</button>
            </div><div class = 'layer'>
            <button onclick = "calculate()" id = 'answer' class="button" style = "width: 65px">ANS</button>
            <button onclick = "appendToDisplay('0')" id = '0' class="button">0</button>
            <button onclick = "appendToDisplay('.')" id = 'decimal' class="button">.</button>
            <button onclick = "appendToDisplay('/')" id = 'divide' class="button">/</button>
            <button onclick = "clearDisplay()" id = 'reset' class="button" style = "width: 65px">RES</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
